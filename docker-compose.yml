services:
  bot:
    build: .
    image: psek-nba-bot
    env_file: .env
    environment:
      DB_PATH: /data/bot.db # inside the volume, whatever .env says
    volumes:
      - bot-data:/data
    restart: unless-stopped
    logging: # Docker keeps logs forever by default; cap them at 3 x 10MB
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
